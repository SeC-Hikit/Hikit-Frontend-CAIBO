<div class="container">
    <div class="row section-distance-up">
        <div class="col-12">
            <h1>Assegnazione media</h1>
            <p>Assegna media a: {{ description }}</p>
        </div>
    </div>
    <div class="my-4">
        <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
    </div>
    <div class="my-4">
        <div class="row full-width">
            <div class="col-md-3 tablez">
                <table class="table table-striped interactive-table thin-rows">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Cancella</th>
                    </tr>
                    </thead>
                    <tr *ngFor="let media of selectedMedias">
                        <td>{{ media.id }}</td>
                        <td>{{ media.name }}</td>
                        <td class="clickable" (click)="onDeleteMedia(media)">
                            <svg class="bi" width="18" height="18" fill="currentColor">
                                <use xlink:href="/assets/bootstrap-icons/bootstrap-icons.svg#trash"/>
                            </svg>
                        </td>
                    </tr>
                </table>
            </div>
            <app-media-table
                    class="col-md-7 offset-md-1"
                    [medias]="medias"
                    (onPreviewClick)="this.openPreview($event)"
                    (onSelectClick)="this.onSelect($event)"
            ></app-media-table>
        </div>
    </div>
    <div class="pagination-position">
        <div class="row">
            <div class="col-8 offset-4">
                <ngb-pagination
                        [pageSize]="entryPerPage"
                        [collectionSize]="totalMedia"
                        [(page)]="page"
                        aria-label="Default pagination"
                        (pageChange)="loadPage(page)"
                ></ngb-pagination>
            </div>
        </div>
    </div>
    <div class="row">
        <button class="btn btn-primary full-width" (click)="save()">Salva</button>
        <button class="btn btn-outline-warning full-width" (click)="onCancel()">Torna a {{name}}</button>
    </div>
</div>
