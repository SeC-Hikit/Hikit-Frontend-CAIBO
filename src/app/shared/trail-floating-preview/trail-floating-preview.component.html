<div
        *ngIf="isVisible"
        [ngClass]="{
    'floating-hide-panel': true
  }"
>
    <span class="close-btn" (click)="onClose.emit()">ｘ</span>
    <label>Anteprima {{ trails.length > 0 ? trails[0].code : '' }}</label>
    <div class="form-group col-md-12 mb-12">
    <span *ngIf="this.municipalities != null && this.municipalities.length > 0">
    <app-map-preview-municipalities
            [municipalitiesToTrails]="municipalities"
            [trail]="trails[0]"
    >
    </app-map-preview-municipalities>
    </span>

        <div *ngIf="this.municipalities == null || this.municipalities.length == 0">
    <span *ngIf="this.trails.length > 0; else noTrail">
    <app-map-preview
            [trailPreview]="trails[0]"
            [otherTrails]=""
            [index]="'0'"
            [markersCoordinates]="markers"
            [showSegmentsInArea]="true"
    ></app-map-preview>
    </span>
            <ng-template #noTrail>
                <app-map-preview
                        [otherTrails]="[]"
                        [markersCoordinates]="markers"
                ></app-map-preview>
            </ng-template>
        </div>
    </div>
</div>
